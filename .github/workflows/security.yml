name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysqlidle-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python dependency and static security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Python 3.15.0
        shell: bash
        run: bash tools/setup_python_3_15_linux.sh
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install application and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit==2.10.1 bandit==1.9.4
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Run Bandit static security scan
        # B608 is intentionally excluded because this product is an interactive
        # SQL shell. SQL input is its core feature and is passed to the DB driver
        # as a whole statement, not interpolated into a privileged fixed query.
        run: bandit -q -r -ll -s B608 feature_governor.py mysql_idle.py mobile_companion.py
