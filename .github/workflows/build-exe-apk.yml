name: Build Windows EXE and Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "bootstrap/trigger-build.txt"
      - ".github/workflows/build-exe-apk.yml"
      - "*.py"
      - "*.spec"
      - "requirements.txt"
      - "MySQLIDLE.iss"
      - "build_windows.ps1"
      - "android-app/**"
      - "tools/restore_sources.py"
  pull_request:
    paths:
      - "bootstrap/trigger-build.txt"
      - ".github/workflows/build-exe-apk.yml"
      - "*.py"
      - "*.spec"
      - "requirements.txt"
      - "MySQLIDLE.iss"
      - "build_windows.ps1"
      - "android-app/**"
      - "tools/restore_sources.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysqlidle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  restore-sources:
    name: Expand source bundle into repository
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore source files
        run: python tools/restore_sources.py
      - name: Commit restored sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source restoration changes."
          else
            git commit -m "Restore MySQL IDLE source files"
            git push
          fi

  build-windows:
    name: Build Windows EXE and installer
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_ENABLED: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore source payload when bootstrapping an empty repo
        run: python tools/restore_sources.py
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
      - name: Generate branded Windows assets
        run: python tools/generate_brand_assets.py
      - name: Run regression tests
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          import unittest
          suite = unittest.TestSuite()
          suite.addTests(unittest.defaultTestLoader.loadTestsFromName('test_mysql_idle'))
          suite.addTests(unittest.defaultTestLoader.loadTestsFromName('test_feature_governor'))
          suite.addTests(unittest.defaultTestLoader.loadTestsFromName('test_packaging_branding'))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          status = 'PASS' if result.wasSuccessful() else 'FAIL'
          print('TEST_RESULT=' + status)
          with open('ci-test-status.txt', 'w', encoding='ascii') as out:
              out.write(status)
          '@ | Set-Content -Encoding utf8 .\run_ci_tests.py
          python .\run_ci_tests.py
          if ((Get-Content .\ci-test-status.txt -Raw).Trim() -ne 'PASS') {
            throw 'Desktop regression tests failed.'
          }
          $global:LASTEXITCODE = 0
      - name: Validate desktop regression result
        if: always()
        shell: pwsh
        run: |
          if (!(Test-Path .\ci-test-status.txt) -or (Get-Content .\ci-test-status.txt -Raw).Trim() -ne 'PASS') {
            throw 'Desktop regression tests did not pass.'
          }
      - name: Compile Python modules
        run: python -m py_compile feature_governor.py mysql_idle.py mobile_companion.py test_feature_governor.py test_mysql_idle.py test_mobile_companion.py test_packaging_branding.py
      - name: Build one-folder desktop app
        run: python -m PyInstaller --clean --noconfirm mysql_idle.spec
      - name: Build portable single-file EXE
        run: python -m PyInstaller --clean --noconfirm mysql_idle_portable.spec
      - name: Smoke-test packaged Windows executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "mysqlidle-smoke-appdata"
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $executables = @(
            (Resolve-Path "dist\mysql_idle\mysql_idle.exe").Path,
            (Resolve-Path "dist\MySQLIDLE_Portable.exe").Path
          )
          foreach ($exe in $executables) {
            Write-Host "Launching packaged app: $exe"
            $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            try {
              for ($second = 0; $second -lt 15; $second++) {
                Start-Sleep -Seconds 1
                $process.Refresh()
                if ($process.HasExited) {
                  throw "Application exited during startup (code $($process.ExitCode)): $exe"
                }
              }
              Write-Host "Startup smoke test passed: $exe"
            } finally {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Sign Windows application executables
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "mysqlidle-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "Windows SDK SignTool was not found on this runner." }
            $files = @("dist\MySQLIDLE_Portable.exe")
            if (Test-Path "dist\mysql_idle") {
              $files += Get-ChildItem "dist\mysql_idle" -Filter "*.exe" -File -Recurse | ForEach-Object { $_.FullName }
            }
            foreach ($file in $files) {
              if (!(Test-Path $file)) { throw "Expected executable to sign was not found: $file" }
              & $signtool.FullName sign /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /v $file
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $file with exit code $LASTEXITCODE" }
              & $signtool.FullName verify /pa /v $file
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $file" }
            }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }
      - name: Build Windows installer and folder archive
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($iscc) {
            & $iscc "MySQLIDLE.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          } else {
            throw "Inno Setup was not found; refusing to publish an incomplete installer."
          }
          if (!(Test-Path "dist\installer\MySQLIDLE-Setup.exe")) {
            throw "Inno Setup installer output is missing; refusing to publish an incomplete release."
          }
          Copy-Item "dist\installer\MySQLIDLE-Setup.exe" "dist\MySQLIDLE-Setup.exe" -Force
      - name: Smoke-test installer, installed launch, and uninstall cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "mysqlidle-installer-smoke-appdata"
          $installDir = Join-Path $env:RUNNER_TEMP "MySQLIDLE-Install-Smoke"
          $setup = (Resolve-Path "dist\MySQLIDLE-Setup.exe").Path
          $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir")
          $install = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)." }

          $installedExe = Join-Path $installDir "mysql_idle.exe"
          if (!(Test-Path $installedExe)) { throw "Installer did not place the desktop executable." }
          $app = Start-Process -FilePath $installedExe -WorkingDirectory $installDir -PassThru
          try {
            for ($second = 0; $second -lt 10; $second++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "Installed application exited during startup (code $($app.ExitCode))." }
            }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

          $uninstaller = Get-ChildItem -Path $installDir -Filter "unins*.exe" -File | Select-Object -First 1
          if (!$uninstaller) { throw "Installer did not register an uninstaller." }
          $uninstallLog = Join-Path $env:RUNNER_TEMP "mysqlidle-uninstall.log"
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$uninstallLog") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            if (Test-Path $uninstallLog) { Get-Content $uninstallLog -Tail 160 }
            throw "Silent uninstall failed with exit code $($uninstall.ExitCode)."
          }
          for ($second = 0; $second -lt 10 -and (Test-Path $installDir); $second++) { Start-Sleep -Seconds 1 }
          if (Test-Path $installDir) { throw "Uninstaller left application files in $installDir." }

          $startMenuShortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\MySQL IDLE.lnk"
          if (Test-Path $startMenuShortcut) { throw "Uninstaller left the Start Menu shortcut behind." }
          Write-Host "Installer launch and uninstall cleanup smoke tests passed."
      - name: Sign Windows installer
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "mysqlidle-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "Windows SDK SignTool was not found on this runner." }
            $file = "dist\MySQLIDLE-Setup.exe"
            if (!(Test-Path $file)) { throw "Expected installer to sign was not found: $file" }
            & $signtool.FullName sign /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /v $file
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for installer with exit code $LASTEXITCODE" }
            & $signtool.FullName verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed." }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Archive signed desktop folder
        shell: pwsh
        run: |
          if (Test-Path "dist\mysql_idle") {
            Compress-Archive -Path "dist\mysql_idle\*" -DestinationPath "dist\MySQLIDLE-Folder.zip" -Force
          }
      - uses: actions/upload-artifact@v7
        with:
          name: MySQLIDLE-Windows
          path: |
            dist/MySQLIDLE_Portable.exe
            dist/MySQLIDLE-Folder.zip
            dist/MySQLIDLE-Setup.exe
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      ANDROID_SIGNING_ENABLED: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore source payload when bootstrapping an empty repo
        run: python tools/restore_sources.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python runtime dependencies for the mobile companion
        run: python -m pip install -r requirements.txt
      - name: Run mobile HTTPS integration tests
        run: python -m unittest -v test_mobile_companion.py test_feature_governor.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Report Android signing readiness
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_SIGNING_ENABLED: ${{ env.ANDROID_SIGNING_ENABLED }}
          ANDROID_KEYSTORE_BASE64_SET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_PASSWORD_SET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          ANDROID_KEY_ALIAS_SET: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          ANDROID_KEY_PASSWORD_SET: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [[ "$ANDROID_SIGNING_ENABLED" == "true" ]]; then
            echo "Android signing configuration detected (secret values are hidden)."
            echo "Android release signing: configured" >> "$GITHUB_STEP_SUMMARY"
          else
            missing=()
            [[ "$ANDROID_KEYSTORE_BASE64_SET" == "true" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
            [[ "$ANDROID_KEYSTORE_PASSWORD_SET" == "true" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
            [[ "$ANDROID_KEY_ALIAS_SET" == "true" ]] || missing+=("ANDROID_KEY_ALIAS")
            [[ "$ANDROID_KEY_PASSWORD_SET" == "true" ]] || missing+=("ANDROID_KEY_PASSWORD")
            echo "::warning::Android release signing unavailable. Missing repository Actions secret names: ${missing[*]}"
            echo "Android release signing: unavailable. Check repository Actions secrets; values are never printed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Locate a previous encrypted signing-key backup
        id: find-signing-backup
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["GITHUB_RUN_ID"])
          api = "https://api.github.com/repos/" + repository
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          found = ""
          try:
              runs = get_json(api + "/actions/runs?branch=main&per_page=50").get("workflow_runs", [])
              for run in runs:
                  run_id = run.get("id")
                  if run_id == current_run or run.get("status") != "completed":
                      continue
                  try:
                      artifacts = get_json(
                          api + "/actions/runs/" + str(run_id) + "/artifacts?per_page=100"
                      ).get("artifacts", [])
                  except Exception:
                      continue
                  if any(
                      item.get("name") == "MySQLIDLE-SigningKey-Backup"
                      and not item.get("expired", True)
                      for item in artifacts
                  ):
                      found = str(run_id)
                      break
          except Exception:
              pass

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("run_id=" + found + "\n")
          print("A previous encrypted signing-key backup is available." if found else
                "No previous encrypted signing-key backup was found.")
          PY
      - name: Download previous encrypted signing-key backup
        if: env.ANDROID_SIGNING_ENABLED == 'true' && steps.find-signing-backup.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: MySQLIDLE-SigningKey-Backup
          run-id: ${{ steps.find-signing-backup.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/key-backup
      - name: Restore Android release keystore
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          target = Path(os.environ["RUNNER_TEMP"], "mysqlidle-release.jks")
          try:
              encoded = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
              encoded = encoded.translate(str.maketrans("-_", "+/"))
              encoded += "=" * (-len(encoded) % 4)
              decoded = base64.b64decode(encoded, validate=True)
              if not decoded:
                  raise ValueError("empty payload")
              target.write_bytes(decoded)
          except Exception:
              target.unlink(missing_ok=True)
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write("ANDROID_KEYSTORE_RESTORE_FAILED=true\n")
              print("::warning::The supplied Android keystore Base64 could not be decoded.")
          else:
              print("Android keystore Base64 decoded; contents remain hidden.")
          PY
      - name: Validate or recover Android signing credentials
        id: validate-signing
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_ALLOW_NEW_SIGNING_KEY: ${{ vars.ANDROID_ALLOW_NEW_SIGNING_KEY }}
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/mysqlidle-release.jks"
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          new_alias="mysqlidle-release"

          # Prefer the publisher's exact existing signing key whenever it validates.
          if [[ "${ANDROID_KEYSTORE_RESTORE_FAILED:-false}" != "true" && -s "$store" ]] &&
             keytool -list -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1 &&
             keytool -list -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1 &&
             keytool -certreq -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -file "$check_dir/validation.csr" >/dev/null 2>&1; then
            {
              printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
              echo "ANDROID_KEYSTORE_WAS_REPLACED=false"
            } >> "$GITHUB_ENV"
            echo "replaced=false" >> "$GITHUB_OUTPUT"
            echo "Existing Android release keystore and credentials validated."
            exit 0
          fi

          # If the supplied file/credentials fail, try the prior encrypted backup.
          encrypted="$RUNNER_TEMP/key-backup/MySQLIDLE-SigningKey.jks.enc"
          if [[ -s "$encrypted" ]] &&
             openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
               -in "$encrypted" -out "$store" -pass env:ANDROID_KEYSTORE_PASSWORD >/dev/null 2>&1 &&
             keytool -list -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$new_alias" >/dev/null 2>&1 &&
             keytool -certreq -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -alias "$new_alias" -file "$check_dir/backup.csr" >/dev/null 2>&1; then
            {
              printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'ANDROID_KEY_ALIAS=%s\n' "$new_alias"
              printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEYSTORE_WAS_REPLACED=true"
            } >> "$GITHUB_ENV"
            echo "replaced=true" >> "$GITHUB_OUTPUT"
            echo "Previous encrypted Android signing-key backup restored and validated."
            exit 0
          fi

          # Never silently rotate the Android app-signing identity. A missing or
          # invalid keystore can break updates for users who already installed the app.
          if [[ "${ANDROID_ALLOW_NEW_SIGNING_KEY:-false}" != "true" ]]; then
            echo "::error::The provided Android keystore and encrypted backup could not be validated. Release signing was stopped to protect update compatibility. Restore the existing key, or set the repository Actions variable ANDROID_ALLOW_NEW_SIGNING_KEY=true only when intentionally creating a new signing identity."
            exit 1
          fi
          # Explicitly opted-in first release or intentional key replacement.
          if [[ ${#ANDROID_KEYSTORE_PASSWORD} -lt 6 ]]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD must contain at least 6 characters to create a replacement signing key."
            exit 1
          fi
          echo "::warning::The operator explicitly allowed generation of a new Android signing identity. Existing installations signed by another key cannot be updated by this identity."
          rm -f "$store"
          keytool -genkeypair -v -storetype JKS -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -alias "$new_alias" -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=MySQL IDLE Release, O=MySQL IDLE" -noprompt >/dev/null 2>&1
          keytool -list -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$new_alias" >/dev/null 2>&1
          keytool -certreq -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -alias "$new_alias" -file "$check_dir/new-key.csr" >/dev/null 2>&1
          {
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$new_alias"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEYSTORE_WAS_REPLACED=true"
          } >> "$GITHUB_ENV"
          echo "replaced=true" >> "$GITHUB_OUTPUT"
          echo "New Android release signing key generated and validated."
      - name: Build release-signed Android APK
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/mysqlidle-release.jks
        run: gradle --no-daemon assembleRelease
      - name: Verify and stage release-signed APK
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        run: |
          set -euo pipefail
          apk="android-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" dist/MySQLIDLE-Mobile-release.apk
          echo "APK_SMOKE_PATH=dist/MySQLIDLE-Mobile-release.apk" >> "$GITHUB_ENV"
          if [[ "${ANDROID_KEYSTORE_WAS_REPLACED:-false}" == "true" ]]; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
              -in "$RUNNER_TEMP/mysqlidle-release.jks" \
              -out dist/MySQLIDLE-SigningKey.jks.enc \
              -pass env:ANDROID_KEYSTORE_PASSWORD
            echo "Encrypted replacement-key backup staged for the CI artifact only."
          fi
      - name: Build debug APK when release signing is not configured
        if: env.ANDROID_SIGNING_ENABLED != 'true'
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Stage debug APK for CI only
        if: env.ANDROID_SIGNING_ENABLED != 'true'
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/MySQLIDLE-Mobile-debug.apk
          echo "APK_SMOKE_PATH=dist/MySQLIDLE-Mobile-debug.apk" >> "$GITHUB_ENV"
      - name: Smoke-test APK on Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_SMOKE_PATH"
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo "no" | avdmanager create avd --force -n mysqlidle-smoke -k "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          "$ANDROID_HOME/emulator/emulator" -avd mysqlidle-smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/mysqlidle-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          if ! timeout 90s adb wait-for-device; then
            cat "$RUNNER_TEMP/mysqlidle-emulator.log"
            adb devices -l || true
            echo "Android emulator did not appear in adb within 90 seconds." >&2
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 60); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/mysqlidle-emulator.log"
              echo "Android emulator process exited before boot completed." >&2
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [[ "$booted" != "true" ]]; then
            cat "$RUNNER_TEMP/mysqlidle-emulator.log"
            adb logcat -d -t 800 || true
            echo "Android emulator did not finish booting within 120 seconds." >&2
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb install -r "$APK_SMOKE_PATH"
          adb shell am force-stop com.mysqlidle.mobile
          adb shell am start -W -n com.mysqlidle.mobile/.MainActivity
          sleep 2
          app_pid="$(adb shell pidof com.mysqlidle.mobile 2>/dev/null | tr -d '\r')"
          if [[ -z "$app_pid" ]]; then
            adb logcat -d -t 1200
            echo "APK process did not remain alive after launch." >&2
            exit 1
          fi
          adb shell uiautomator dump /sdcard/mysqlidle-window.xml >/dev/null
          adb pull /sdcard/mysqlidle-window.xml "$RUNNER_TEMP/mysqlidle-window.xml" >/dev/null
          grep -q "Connect to the desktop companion" "$RUNNER_TEMP/mysqlidle-window.xml"
          grep -q "MySQL IDLE logo" "$RUNNER_TEMP/mysqlidle-window.xml"
          echo "APK installed and launched. MainActivity stayed alive and showed branded connection UI (PID $app_pid)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: MySQLIDLE-Android
          path: dist/MySQLIDLE-Mobile-*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload encrypted Android signing-key backup
        if: env.ANDROID_SIGNING_ENABLED == 'true' && steps.validate-signing.outputs.replaced == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MySQLIDLE-SigningKey-Backup
          path: dist/MySQLIDLE-SigningKey.jks.enc
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish signed release assets
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))) && needs.build-android.result == 'success'
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check signing configuration
        id: signing
        shell: bash
        env:
          ANDROID_SIGNING_ENABLED: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          ANDROID_KEYSTORE_BASE64_SET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_PASSWORD_SET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          ANDROID_KEY_ALIAS_SET: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          ANDROID_KEY_PASSWORD_SET: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          WINDOWS_SIGNING_ENABLED: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          WINDOWS_BUILD_SUCCESS: ${{ needs.build-windows.result == 'success' }}
        run: |
          echo "ready=$ANDROID_SIGNING_ENABLED" >> "$GITHUB_OUTPUT"
          missing=()
          [[ "$ANDROID_KEYSTORE_BASE64_SET" == "true" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ "$ANDROID_KEYSTORE_PASSWORD_SET" == "true" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ "$ANDROID_KEY_ALIAS_SET" == "true" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ "$ANDROID_KEY_PASSWORD_SET" == "true" ]] || missing+=("ANDROID_KEY_PASSWORD")
          if [[ "$WINDOWS_BUILD_SUCCESS" == "true" ]]; then
            echo "windows_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$WINDOWS_SIGNING_ENABLED" == "true" && "$WINDOWS_BUILD_SUCCESS" == "true" ]]; then
            echo "windows_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_signed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$ANDROID_SIGNING_ENABLED" == "true" ]]; then
            {
              echo "## Release signing"
              echo "- Android release APK is configured for signing and will be verified."
              if [[ "$WINDOWS_BUILD_SUCCESS" == "true" && "$WINDOWS_SIGNING_ENABLED" == "true" ]]; then
                echo "- Windows EXE, installer, and folder archive will be included; Authenticode signing is configured and verified."
              elif [[ "$WINDOWS_BUILD_SUCCESS" == "true" ]]; then
                echo "- Windows EXE, installer, and folder archive will be included, but they are NOT Authenticode-signed. A signing-status notice will be attached."
              else
                echo "- The Windows build did not succeed; Windows files will be excluded from this release."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Release publication skipped. Configure all four Android keystore secrets first."
            {
              echo "## Release not published"
              echo "A signed Android APK is required for release publication."
              if [[ ${#missing[@]} -gt 0 ]]; then
                echo "Missing Actions secret names (values are never displayed): ${missing[*]}"
              fi
              echo "Set the missing secrets documented in SIGNING.md, then run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ ${#missing[@]} -gt 0 ]]; then
              echo "::warning::Missing Android signing Actions secret names: ${missing[*]}"
            fi
          fi
      - name: Download signed Android artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: MySQLIDLE-Android
          path: release-assets
      - name: Download Windows build artifacts
        if: steps.signing.outputs.ready == 'true' && steps.signing.outputs.windows_ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: MySQLIDLE-Windows
          path: release-assets
      - name: Create Windows signing-status notice
        if: steps.signing.outputs.ready == 'true' && steps.signing.outputs.windows_ready == 'true'
        shell: bash
        env:
          WINDOWS_SIGNED: ${{ steps.signing.outputs.windows_signed }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [[ "$WINDOWS_SIGNED" == "true" ]]; then
            printf '%s\n' "Windows EXE and installer: Authenticode signatures were applied and verified by CI." > release-assets/WINDOWS-SIGNING-STATUS.txt
          else
            printf '%s\n' \
              "WARNING: The Windows EXE and installer in this release are NOT Authenticode-signed." \
              "Windows may display SmartScreen or unknown-publisher warnings." \
              "Only download from this official repository and verify SHA256SUMS." \
              "A trusted Windows code-signing certificate was not configured for this build." \
              > release-assets/WINDOWS-SIGNING-STATUS.txt
          fi
      - name: Validate release bundle and generate checksums
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          WINDOWS_BUILD_READY: ${{ steps.signing.outputs.windows_ready }}
        run: |
          set -euo pipefail
          test -s "release-assets/MySQLIDLE-Mobile-release.apk"
          cd release-assets
          if [[ "$WINDOWS_BUILD_READY" == "true" ]]; then
            test -s "MySQLIDLE_Portable.exe"
            test -s "MySQLIDLE-Folder.zip"
            test -s "MySQLIDLE-Setup.exe"
            test -s "WINDOWS-SIGNING-STATUS.txt"
          fi
          assets=(MySQLIDLE-Mobile-release.apk MySQLIDLE_Portable.exe MySQLIDLE-Folder.zip MySQLIDLE-Setup.exe WINDOWS-SIGNING-STATUS.txt)
          included=()
          for asset in "${assets[@]}"; do
            [[ -s "$asset" ]] && included+=("$asset")
          done
          sha256sum "${included[@]}" > SHA256SUMS
          echo "SHA-256 checksums generated for: ${included[*]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish Android-only release
        if: steps.signing.outputs.ready == 'true' && steps.signing.outputs.windows_ready != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v3.0.0-build.{0}', github.run_number) }}
          target_commitish: main
          name: MySQL IDLE 3.0 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/MySQLIDLE-Mobile-release.apk
            release-assets/SHA256SUMS
      - name: Publish Android and Windows release assets
        if: steps.signing.outputs.ready == 'true' && steps.signing.outputs.windows_ready == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v3.0.0-build.{0}', github.run_number) }}
          target_commitish: main
          name: MySQL IDLE 3.0 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/MySQLIDLE-Mobile-release.apk
            release-assets/MySQLIDLE_Portable.exe
            release-assets/MySQLIDLE-Folder.zip
            release-assets/MySQLIDLE-Setup.exe
            release-assets/WINDOWS-SIGNING-STATUS.txt
            release-assets/SHA256SUMS
